{{template "header.html" dict "title" "网站设置" "nickname" .nickname}}
<h2 class="page-title mb-4">网站设置</h2>
{{if .error}}
<div class="alert alert-danger py-2">{{.error}}</div>
{{end}}
<div class="card shadow-sm mb-4">
    <div class="card-body">
        <form method="post" action="/adm1n/settings">
            <div class="mb-3">
                <label class="form-label">网站标题 <code class="ms-2">{{`{{index .settings "site_title"}}`}}</code></label>
                <input type="text" name="site_title" class="form-control" value="{{index .settings "site_title"}}" placeholder="网站标题">
            </div>
            <div class="mb-3">
                <label class="form-label">网站关键词 <code class="ms-2">{{`{{index .settings "site_keywords"}}`}}</code></label>
                <input type="text" name="site_keywords" class="form-control" value="{{index .settings "site_keywords"}}" placeholder="关键词1,关键词2">
            </div>
            <div class="mb-3">
                <label class="form-label">网站描述 <code class="ms-2">{{`{{index .settings "site_description"}}`}}</code></label>
                <textarea name="site_description" class="form-control" rows="3" placeholder="网站描述">{{index .settings "site_description"}}</textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">网站图标 <code class="ms-2">{{`{{index .settings "site_favicon"}}`}}</code></label>
                <input type="text" name="site_favicon" class="form-control" value="{{index .settings "site_favicon"}}" placeholder="https://example.com/favicon.ico">
            </div>
            <div class="mb-3">
                <label class="form-label">底部版权信息 <code class="ms-2">{{`{{index .settings "site_footer"}}`}}</code></label>
                <textarea name="site_footer" class="form-control" rows="3" placeholder="底部版权信息">{{index .settings "site_footer"}}</textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">前台模板 <code class="ms-2">{{`{{index .settings "front_template"}}`}}</code></label>
                <select name="front_template" class="form-select">
                    {{$currentTemplate := index .settings "front_template"}}
                    {{range .frontTemplates}}
                    <option value="{{.}}" {{if eq . $currentTemplate}}selected{{end}}>{{.}}</option>
                    {{end}}
                </select>
                <div class="form-text">从 <code>templates/</code> 下的前台模板目录中选择；目录需包含 <code>index.html</code> 和 <code>layout.html</code>。</div>
            </div>
            <hr class="my-4">
            <button type="submit" class="btn btn-deepgreen">保存</button>
        </form>
    </div>
</div>
{{template "footer.html"}}
