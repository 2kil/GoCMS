<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - {{.title}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde@2/dist/easymde.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.snow.css">
    <link rel="stylesheet" href="/admin-assets/css/admin.css">
</head>
<body class="admin-page">
<nav class="navbar navbar-expand navbar-dark bg-deepgreen px-4">
    <a class="navbar-brand" href="/adm1n/dashboard">CMS 管理后台</a>
    <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item">
            <button type="button" class="nav-link btn btn-link text-light admin-account-trigger" data-bs-toggle="modal" data-bs-target="#adminPasswordModal"><i class="bi bi-person-circle"></i>{{if .nickname}}{{.nickname}}{{else}}管理员{{end}}</button>
        </li>
        <li class="nav-item">
            <a class="nav-link btn btn-outline-light btn-sm px-3" href="/adm1n/logout"><i class="bi bi-box-arrow-right me-1"></i>退出</a>
        </li>
    </ul>
</nav>
<div class="modal fade" id="adminPasswordModal" tabindex="-1" aria-labelledby="adminPasswordModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form method="post" action="/adm1n/settings/account">
                <div class="modal-header">
                    <h5 class="modal-title" id="adminPasswordModalLabel">修改管理员密码</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">当前密码</label>
                        <input type="password" name="old_password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">新密码</label>
                        <input type="password" name="new_password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">确认新密码</label>
                        <input type="password" name="confirm_password" class="form-control" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-deepgreen" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-deepgreen">保存密码</button>
                </div>
            </form>
        </div>
    </div>
</div>
<div class="d-flex admin-shell">
    <nav class="sidebar bg-deepgreen text-white p-3">
        <a href="/adm1n/dashboard" class="sidebar-link"><i class="bi bi-speedometer2"></i><span>仪表盘</span></a>
        <a href="/adm1n/posts" class="sidebar-link"><i class="bi bi-file-earmark-text"></i><span>文章管理</span></a>
        <a href="/adm1n/columns" class="sidebar-link"><i class="bi bi-diagram-3"></i><span>栏目管理</span></a>
        <a href="/adm1n/uploads" class="sidebar-link"><i class="bi bi-images"></i><span>图片管理</span></a>
        <a href="/adm1n/tags" class="sidebar-link"><i class="bi bi-tags"></i><span>自定义标签</span></a>
        <a href="/adm1n/settings" class="sidebar-link"><i class="bi bi-gear"></i><span>网站设置</span></a>
    </nav>
    <main class="main-content p-4">
