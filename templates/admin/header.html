<body class="admin-page">
<script>
(function(){
    function csrfToken(){
        const match=document.cookie.match(/(?:^|;\s*)cms_csrf=([^;]+)/);
        return match?decodeURIComponent(match[1]):'';
    }
    function ensureFormToken(form){
        if(!form || String(form.method).toUpperCase()!=='POST'){return;}
        let input=form.querySelector('input[name="_csrf"]');
        if(!input){
            input=document.createElement('input');
            input.type='hidden';
            input.name='_csrf';
            form.appendChild(input);
        }
        input.value=csrfToken();
    }
    document.addEventListener('submit',function(event){
        ensureFormToken(event.target);
    },true);
    document.addEventListener('DOMContentLoaded',function(){
        document.querySelectorAll('form[method="post"]').forEach(ensureFormToken);
    });
    if(window.fetch){
        const originalFetch=window.fetch;
        window.fetch=function(input,init){
            init=init||{};
            const requestUrl=typeof input==='string'?input:(input&&input.url)||'';
            const url=new URL(requestUrl, window.location.href);
            const method=String(init.method || (input&&input.method) || 'GET').toUpperCase();
            if(url.origin===window.location.origin && !['GET','HEAD','OPTIONS','TRACE'].includes(method)){
                const headers=new Headers(init.headers || (input&&input.headers) || {});
                headers.set('X-CSRF-Token', csrfToken());
                init.headers=headers;
            }
            return originalFetch(input,init);
        };
    }
})();
</script>

                </div>

                    </div>
                    <div class="mb-3">
                        <label class="form-label">新密码</label>
                        <input type="password" name="new_password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">确认新密码</label>
                        <input type="password" name="confirm_password" class="form-control" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-deepgreen" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-deepgreen">保存密码</button>
                </div>
            </form>
        </div>
    </div>
